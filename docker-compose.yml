# Stack do AviRonda: proxy HTTPS (Caddy) -> API (FastAPI) -> banco (PostgreSQL).
# Só o Caddy publica portas. API e banco ficam na rede interna.
services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-avironda-api:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://avironda:${POSTGRES_PASSWORD}@db:5432/avironda
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: avironda
      POSTGRES_USER: avironda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avironda -d avironda"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Faz o papel do carrinho enquanto o Raspberry Pi não está ligado. Liga com: --profile demo
  simulador:
    profiles: ["demo"]
    image: ${API_IMAGE:-avironda-api:local}
    restart: unless-stopped
    command: ["python", "scripts/simulador.py", "--api", "http://api:8000", "--rondas", "0"]
    env_file: .env
    environment:
      SIMULADOR_FILA: /tmp/fila.json
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
