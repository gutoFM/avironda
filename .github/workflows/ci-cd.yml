name: CI/CD AviRonda

# Toda branch passa pelas barreiras. Só a main publica imagem e faz deploy.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # O registro só aceita minúsculas (o dono da conta é gutoFM).
  IMAGEM: ghcr.io/gutofm/avironda
  TRIVY_IMAGEM: aquasec/trivy:0.76.2
  TERRAFORM_IMAGEM: hashicorp/terraform:1.14.6

jobs:
  segredos:
    name: Gitleaks (segredos no histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CLI oficial em container, varrendo o histórico inteiro a cada execução.
      # A action no evento de push olha só os commits daquele envio e falha no primeiro push de uma branch.
      - name: Gitleaks no histórico completo
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact -v

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci
        env:
          SEMGREP_RULES: p/default p/python p/dockerfile p/terraform p/github-actions

  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  iac:
    name: Terraform e Trivy config (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: terraform fmt e validate
        run: |
          docker run --rm -v "$PWD/infra/terraform":/tf -w /tf "$TERRAFORM_IMAGEM" fmt -check -recursive
          docker run --rm -v "$PWD/infra/terraform":/tf -w /tf "$TERRAFORM_IMAGEM" init -backend=false -input=false
          docker run --rm -v "$PWD/infra/terraform":/tf -w /tf "$TERRAFORM_IMAGEM" validate
      - name: Trivy nas configurações (Dockerfile, compose e Terraform)
        run: |
          docker run --rm -v "$PWD":/src "$TRIVY_IMAGEM" config \
            --exit-code 1 --severity HIGH,CRITICAL /src

  imagem:
    name: Build, Trivy da imagem e publicação
    runs-on: ubuntu-latest
    needs: [segredos, sast, testes, iac]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t "$IMAGEM:${{ github.sha }}" .
      - name: Trivy na imagem (barra HIGH e CRITICAL com correção disponível)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGEM" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "$IMAGEM:${{ github.sha }}"
      - name: Publicar no GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGEM:${{ github.sha }}" "$IMAGEM:latest"
          docker push "$IMAGEM:${{ github.sha }}"
          docker push "$IMAGEM:latest"

  deploy:
    name: Deploy no Azure
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: ${{ vars.URL_PUBLICA }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Login sem senha guardada: OIDC entre o GitHub e uma identidade com acesso só ao resource group.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Nenhuma porta de administração é aberta para o GitHub: o comando entra pelo plano de controle do Azure.
      - name: Atualizar a VM para este commit
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_VM_NAME }}
        run: |
          saida=$(az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
            --scripts "/opt/avironda/deploy.sh ${{ github.sha }}" --query "value[0].message" -o tsv)
          echo "$saida"
          echo "$saida" | grep -q "\[deploy\] versão ${{ github.sha }} no ar"
      - name: Smoke test na URL pública
        env:
          URL: ${{ vars.URL_PUBLICA }}
        run: |
          for tentativa in $(seq 1 10); do
            if curl -fsS "$URL/health"; then echo; echo "MVP respondendo"; exit 0; fi
            sleep 6
          done
          echo "O MVP não respondeu em $URL" >&2
          exit 1
