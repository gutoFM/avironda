global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: avironda
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    # O endereço do MVP (local ou nuvem) fica em alvos.json, fora do Git. Modelo: alvos.example.json
    file_sd_configs:
      - files: [/etc/prometheus/alvos.json]
